name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  curseforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract release notes as CurseForge changelog
        run: mkdir -p build && printf '%s' "${{ github.event.release.body }}" > build/curseforge-changelog.md

      - name: Build and publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew build curseforge -Pcurseforge_project_id=1787774
